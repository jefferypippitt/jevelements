<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canvas hover test</title>
    <!-- The canvas pointer sweep (src/content/sweep.ts): pnpm test:build, node test/serve.mjs, then open
         /test/hover.html and run JevTest.sweepHover(document.getElementById('hero')). -->
    <script src="/dist/probe.js"></script>
    <script src="/test/dist/pipeline.js"></script>
    <style>
      body { margin: 0; font-family: system-ui; background: #000; color: #fff; }
      #hero { position: relative; padding: 24px; }
      #prism { display: block; width: 720px; height: 405px; }
      #prism-label { position: absolute; left: 48px; top: 48px; margin: 0; pointer-events: none; }
      #spot { display: block; width: 360px; height: 200px; margin-top: 16px; }
      #still { display: block; width: 240px; height: 120px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <section id="hero">
      <canvas id="prism"></canvas>
      <h1 id="prism-label">Prism</h1>
      <canvas id="spot" width="360" height="200"></canvas>
      <canvas id="still" width="240" height="120"></canvas>
    </section>

    <script>
      // A triangle whose sides light up as the pointer gets near them, like a hero shader. It listens on
      // window, eases a 0–1 y-up mouse uniform toward the pointer, and fades a hover uniform in and out.
      const canvas = document.getElementById('prism')
      const dpr = window.devicePixelRatio || 1
      canvas.width = 720 * dpr
      canvas.height = 405 * dpr
      const gl = canvas.getContext('webgl', { preserveDrawingBuffer: false })
      const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s }
      const program = gl.createProgram()
      gl.attachShader(program, compile(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }'))
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `
        precision highp float;
        uniform vec2 u_res; uniform vec2 u_mouse; uniform float u_hover; uniform float u_time;
        float seg(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h); }
        void main(){
          vec2 uv = gl_FragCoord.xy / u_res;
          vec2 a = vec2(0.5, 0.85), b = vec2(0.2, 0.15), c = vec2(0.8, 0.15);
          float glow = 0.0;
          for (int i = 0; i < 3; i++) {
            vec2 e0 = i == 0 ? a : i == 1 ? b : c;
            vec2 e1 = i == 0 ? b : i == 1 ? c : a;
            float line = smoothstep(0.012, 0.0, seg(uv, e0, e1));
            float near = smoothstep(0.35, 0.0, seg(u_mouse, e0, e1)) * u_hover;
            glow += line * (0.25 + 0.75 * near);
          }
          float shimmer = 0.02 * sin(u_time);
          gl_FragColor = vec4(vec3(glow) + shimmer + 0.02, 1.0);
        }`))
      gl.linkProgram(program)
      gl.useProgram(program)
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
      const loc = gl.getAttribLocation(program, 'p')
      gl.enableVertexAttribArray(loc)
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0)
      const uRes = gl.getUniformLocation(program, 'u_res')
      const uMouse = gl.getUniformLocation(program, 'u_mouse')
      const uHover = gl.getUniformLocation(program, 'u_hover')
      const uTime = gl.getUniformLocation(program, 'u_time')
      const target = { x: 0.5, y: 0.5, hover: 0 }
      const mouse = { x: 0.5, y: 0.5, hover: 0 }
      window.addEventListener('pointermove', (e) => {
        const r = canvas.getBoundingClientRect()
        const x = (e.clientX - r.left) / r.width
        const y = 1 - (e.clientY - r.top) / r.height
        const inside = x >= 0 && x <= 1 && y >= 0 && y <= 1
        target.hover = inside ? 1 : 0
        if (inside) { target.x = x; target.y = y }
      })
      const draw = (ms) => {
        mouse.x += (target.x - mouse.x) * 0.1
        mouse.y += (target.y - mouse.y) * 0.1
        mouse.hover += (target.hover - mouse.hover) * 0.06
        gl.viewport(0, 0, canvas.width, canvas.height)
        gl.uniform2f(uRes, canvas.width, canvas.height)
        gl.uniform2f(uMouse, mouse.x, mouse.y)
        gl.uniform1f(uHover, mouse.hover)
        gl.uniform1f(uTime, ms / 1000)
        gl.drawArrays(gl.TRIANGLES, 0, 3)
        requestAnimationFrame(draw)
      }
      requestAnimationFrame(draw)

      // A 2D spotlight that follows the pointer with the canvas's own mousemove (offsetX/offsetY).
      const spot = document.getElementById('spot')
      const g = spot.getContext('2d')
      let sx = -999
      let sy = -999
      spot.addEventListener('mousemove', (e) => { sx = e.offsetX; sy = e.offsetY; paint() })
      spot.addEventListener('mouseleave', () => { sx = sy = -999; paint() })
      const paint = () => {
        g.fillStyle = '#111'
        g.fillRect(0, 0, 360, 200)
        const grad = g.createRadialGradient(sx, sy, 0, sx, sy, 60)
        grad.addColorStop(0, '#ffcc00')
        grad.addColorStop(1, 'rgba(255, 204, 0, 0)')
        g.fillStyle = grad
        g.fillRect(0, 0, 360, 200)
      }
      paint()
      // ?taint: a cross-origin image drawn into it, so it can't be read back and the sweep has to use
      // screenshots instead.
      // A tainted canvas stays tainted, so drawing the image once is enough.
      if (location.search.includes('taint')) {
        const img = new Image()
        img.onload = () => g.drawImage(img, 0, 0, 4, 4)
        img.src = `http://${location.hostname === 'localhost' ? '127.0.0.1' : 'localhost'}:${location.port}/test/texture.svg`
      }

      // A canvas that ignores the pointer: the sweep must not report it.
      const still = document.getElementById('still').getContext('2d')
      still.fillStyle = '#245'
      still.fillRect(0, 0, 240, 120)
    </script>
  </body>
</html>
